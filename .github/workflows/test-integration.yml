name: Integration Tests

on:
    workflow_call:
        inputs:
            ref:
                description: "Git ref to checkout"
                required: true
                type: string
            sha:
                description: "Git SHA for the commit"
                required: true
                type: string
        secrets:
            test-deploy-token:
                description: "GitHub token for test deployments"
                required: true

permissions:
    contents: read

jobs:
    # Git-level tests verify repository state without waiting for Pages deployment
    test-git-lifecycle:
        name: "[Git] Lifecycle"
        runs-on: ubuntu-latest
        env:
            TEST_ID: test-git-lifecycle
            TEST_UMBRELLA_DIR: pr-preview-run-${{ github.run_id }}
            TEST_DEPLOY_REPO: rozzjrw/pr-preview-action-testing
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  ref: ${{ inputs.sha }}

            - name: Modify fixture
              env:
                  STEP_TEST_ID: ${{ env.TEST_ID }}
              run: sed -i.bak 's/<p id="testid">.*<\/p>/<p id="testid">'"$STEP_TEST_ID"'-INITIALISED<\/p>/' test/fixtures/html/index.html

            - name: Deploy
              uses: ./
              with:
                  pr-number: ${{ env.TEST_ID }}
                  umbrella-dir: ${{ env.TEST_UMBRELLA_DIR }}
                  token: ${{ secrets.test-deploy-token }}
                  deploy-repository: ${{ env.TEST_DEPLOY_REPO }}
                  preview-branch: ${{ env.TEST_ID }}
                  source-dir: test/fixtures/html
                  action: deploy
                  comment: false
                  wait-for-pages-deployment: false
                  git-config-name: GitHub Actions
                  git-config-email: actions@github.com
                  deploy-commit-message: deploy ${{ env.TEST_ID }} ${{ github.run_id }}
                  remove-commit-message: remove ${{ env.TEST_ID }} ${{ github.run_id }}

            - name: Verify deployed
              env:
                  GITHUB_TOKEN: ${{ secrets.test-deploy-token }}
                  DEPLOY_REPO: ${{ env.TEST_DEPLOY_REPO }}
                  PREVIEW_BRANCH: ${{ env.TEST_ID }}
                  UMBRELLA_DIR: ${{ env.TEST_UMBRELLA_DIR }}
                  STEP_TEST_ID: ${{ env.TEST_ID }}
              run: bash test/integration/test-git-lifecycle.sh "deployed" "${STEP_TEST_ID}-INITIALISED"

            - name: Modify fixture
              env:
                  STEP_TEST_ID: ${{ env.TEST_ID }}
              run: sed -i.bak 's/<p id="testid">.*<\/p>/<p id="testid">'"$STEP_TEST_ID"'-REDEPLOYED<\/p>/' test/fixtures/html/index.html

            - name: Redeploy
              uses: ./
              with:
                  pr-number: ${{ env.TEST_ID }}
                  umbrella-dir: ${{ env.TEST_UMBRELLA_DIR }}
                  token: ${{ secrets.test-deploy-token }}
                  deploy-repository: ${{ env.TEST_DEPLOY_REPO }}
                  preview-branch: ${{ env.TEST_ID }}
                  source-dir: test/fixtures/html
                  action: deploy
                  comment: false
                  wait-for-pages-deployment: false
                  git-config-name: GitHub Actions
                  git-config-email: actions@github.com
                  deploy-commit-message: deploy ${{ env.TEST_ID }} ${{ github.run_id }}
                  remove-commit-message: remove ${{ env.TEST_ID }} ${{ github.run_id }}

            - name: Verify redeployed
              env:
                  GITHUB_TOKEN: ${{ secrets.test-deploy-token }}
                  DEPLOY_REPO: ${{ env.TEST_DEPLOY_REPO }}
                  PREVIEW_BRANCH: ${{ env.TEST_ID }}
                  UMBRELLA_DIR: ${{ env.TEST_UMBRELLA_DIR }}
                  STEP_TEST_ID: ${{ env.TEST_ID }}
              run: bash test/integration/test-git-lifecycle.sh "deployed" "${STEP_TEST_ID}-REDEPLOYED"

            - name: Remove
              uses: ./
              with:
                  pr-number: ${{ env.TEST_ID }}
                  umbrella-dir: ${{ env.TEST_UMBRELLA_DIR }}
                  token: ${{ secrets.test-deploy-token }}
                  deploy-repository: ${{ env.TEST_DEPLOY_REPO }}
                  preview-branch: ${{ env.TEST_ID }}
                  action: remove
                  comment: false
                  wait-for-pages-deployment: false
                  git-config-name: GitHub Actions
                  git-config-email: actions@github.com
                  deploy-commit-message: deploy ${{ env.TEST_ID }} ${{ github.run_id }}
                  remove-commit-message: remove ${{ env.TEST_ID }} ${{ github.run_id }}

            - name: Verify removed
              env:
                  GITHUB_TOKEN: ${{ secrets.test-deploy-token }}
                  DEPLOY_REPO: ${{ env.TEST_DEPLOY_REPO }}
                  PREVIEW_BRANCH: ${{ env.TEST_ID }}
                  UMBRELLA_DIR: ${{ env.TEST_UMBRELLA_DIR }}
              run: bash test/integration/test-git-lifecycle.sh "removed"

            - name: Cleanup
              if: failure()
              env:
                  CLEANUP_DEPLOY_REPO: ${{ env.TEST_DEPLOY_REPO }}
                  CLEANUP_TEST_ID: ${{ env.TEST_ID }}
                  CLEANUP_TOKEN: ${{ secrets.test-deploy-token }}
                  CLEANUP_UMBRELLA_DIR: ${{ env.TEST_UMBRELLA_DIR }}
              run: |
                  echo "Action removal failed or was incomplete, performing manual cleanup..."
                  source test/lib/cleanup-test-deployment.sh
                  cleanup_deployment "$CLEANUP_DEPLOY_REPO" "$CLEANUP_TEST_ID" "$CLEANUP_TOKEN" "$CLEANUP_UMBRELLA_DIR"

    test-git-custom-umbrella:
        name: "[Git] Custom umbrella"
        runs-on: ubuntu-latest
        env:
            TEST_ID: test-git-custom-umbrella
            TEST_UMBRELLA_DIR: pr-preview-run-${{ github.run_id }}
            CUSTOM_UMBRELLA_DIR: custom-previews-run-${{ github.run_id }}
            TEST_DEPLOY_REPO: rozzjrw/pr-preview-action-testing
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  ref: ${{ inputs.sha }}

            - name: Modify fixture
              env:
                  STEP_TEST_ID: ${{ env.TEST_ID }}
              run: sed -i 's/<p id="testid">.*<\/p>/<p id="testid">'"$STEP_TEST_ID"'<\/p>/' test/fixtures/html/index.html

            - name: Deploy
              uses: ./
              with:
                  pr-number: ${{ env.TEST_ID }}
                  umbrella-dir: ${{ env.CUSTOM_UMBRELLA_DIR }}
                  token: ${{ secrets.test-deploy-token }}
                  deploy-repository: ${{ env.TEST_DEPLOY_REPO }}
                  preview-branch: ${{ env.TEST_ID }}
                  source-dir: test/fixtures/html
                  action: deploy
                  comment: false
                  wait-for-pages-deployment: false
                  git-config-name: GitHub Actions
                  git-config-email: actions@github.com
                  deploy-commit-message: deploy ${{ env.TEST_ID }} ${{ github.run_id }}
                  remove-commit-message: remove ${{ env.TEST_ID }} ${{ github.run_id }}

            - name: Verify
              env:
                  GITHUB_TOKEN: ${{ secrets.test-deploy-token }}
                  DEPLOY_REPO: ${{ env.TEST_DEPLOY_REPO }}
                  PREVIEW_BRANCH: ${{ env.TEST_ID }}
                  TEST_UMBRELLA_DIR: ${{ env.TEST_UMBRELLA_DIR }}
                  CUSTOM_UMBRELLA_DIR: ${{ env.CUSTOM_UMBRELLA_DIR }}
              run: bash test/integration/test-git-custom-umbrella.sh

            - name: Cleanup
              if: always()
              env:
                  CLEANUP_DEPLOY_REPO: ${{ env.TEST_DEPLOY_REPO }}
                  CLEANUP_TEST_ID: ${{ env.TEST_ID }}
                  CLEANUP_TOKEN: ${{ secrets.test-deploy-token }}
                  CLEANUP_UMBRELLA_DIR: ${{ env.TEST_UMBRELLA_DIR }}
                  CLEANUP_CUSTOM_UMBRELLA_DIR: ${{ env.CUSTOM_UMBRELLA_DIR }}
              run: |
                  source test/lib/cleanup-test-deployment.sh
                  cleanup_deployment "$CLEANUP_DEPLOY_REPO" "$CLEANUP_TEST_ID" "$CLEANUP_TOKEN" "$CLEANUP_UMBRELLA_DIR" "$CLEANUP_CUSTOM_UMBRELLA_DIR"

    test-git-concurrent:
        name: "[Git] Concurrency"
        runs-on: ubuntu-latest
        env:
            TEST_ID: test-git-concurrent
            TEST_UMBRELLA_DIR: pr-preview-run-${{ github.run_id }}
            TEST_DEPLOY_REPO: rozzjrw/pr-preview-action-testing
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  ref: ${{ inputs.sha }}

            - name: Modify fixture
              env:
                  STEP_TEST_ID: ${{ env.TEST_ID }}
              run: sed -i.bak 's/<p id="testid">.*<\/p>/<p id="testid">'"$STEP_TEST_ID"'-1<\/p>/' test/fixtures/html/index.html

            - name: Deploy PR 1
              uses: ./
              with:
                  pr-number: ${{ env.TEST_ID }}-1
                  umbrella-dir: ${{ env.TEST_UMBRELLA_DIR }}
                  token: ${{ secrets.test-deploy-token }}
                  deploy-repository: ${{ env.TEST_DEPLOY_REPO }}
                  preview-branch: ${{ env.TEST_ID }}
                  source-dir: test/fixtures/html
                  action: deploy
                  comment: false
                  wait-for-pages-deployment: false
                  git-config-name: GitHub Actions
                  git-config-email: actions@github.com
                  deploy-commit-message: deploy ${{ env.TEST_ID }} ${{ github.run_id }}
                  remove-commit-message: remove ${{ env.TEST_ID }} ${{ github.run_id }}

            - name: Modify fixture
              env:
                  STEP_TEST_ID: ${{ env.TEST_ID }}
              run: sed -i.bak 's/<p id="testid">.*<\/p>/<p id="testid">'"$STEP_TEST_ID"'-2<\/p>/' test/fixtures/html/index.html

            - name: Deploy PR 2
              uses: ./
              with:
                  pr-number: ${{ env.TEST_ID }}-2
                  umbrella-dir: ${{ env.TEST_UMBRELLA_DIR }}
                  token: ${{ secrets.test-deploy-token }}
                  deploy-repository: ${{ env.TEST_DEPLOY_REPO }}
                  preview-branch: ${{ env.TEST_ID }}
                  source-dir: test/fixtures/html
                  action: deploy
                  comment: false
                  wait-for-pages-deployment: false
                  git-config-name: GitHub Actions
                  git-config-email: actions@github.com
                  deploy-commit-message: deploy ${{ env.TEST_ID }} ${{ github.run_id }}
                  remove-commit-message: remove ${{ env.TEST_ID }} ${{ github.run_id }}

            - name: Modify fixture
              env:
                  STEP_TEST_ID: ${{ env.TEST_ID }}
              run: sed -i.bak 's/<p id="testid">.*<\/p>/<p id="testid">'"$STEP_TEST_ID"'-2-redeployed<\/p>/' test/fixtures/html/index.html

            - name: Deploy PR 2 (again)
              uses: ./
              with:
                  pr-number: ${{ env.TEST_ID }}-2
                  umbrella-dir: ${{ env.TEST_UMBRELLA_DIR }}
                  token: ${{ secrets.test-deploy-token }}
                  deploy-repository: ${{ env.TEST_DEPLOY_REPO }}
                  preview-branch: ${{ env.TEST_ID }}
                  source-dir: test/fixtures/html
                  action: deploy
                  comment: false
                  wait-for-pages-deployment: false
                  git-config-name: GitHub Actions
                  git-config-email: actions@github.com
                  deploy-commit-message: deploy ${{ env.TEST_ID }} ${{ github.run_id }}
                  remove-commit-message: remove ${{ env.TEST_ID }} ${{ github.run_id }}

            - name: Verify
              env:
                  GITHUB_TOKEN: ${{ secrets.test-deploy-token }}
                  DEPLOY_REPO: ${{ env.TEST_DEPLOY_REPO }}
                  PREVIEW_BRANCH: ${{ env.TEST_ID }}
                  UMBRELLA_DIR: ${{ env.TEST_UMBRELLA_DIR }}
              run: bash test/integration/test-git-concurrent.sh

            - name: Cleanup
              if: always()
              env:
                  CLEANUP_DEPLOY_REPO: ${{ env.TEST_DEPLOY_REPO }}
                  CLEANUP_TEST_ID: ${{ env.TEST_ID }}
                  CLEANUP_TOKEN: ${{ secrets.test-deploy-token }}
                  CLEANUP_UMBRELLA_DIR: ${{ env.TEST_UMBRELLA_DIR }}
              run: |
                  source test/lib/cleanup-test-deployment.sh
                  cleanup_deployment "$CLEANUP_DEPLOY_REPO" "$CLEANUP_TEST_ID" "$CLEANUP_TOKEN" "$CLEANUP_UMBRELLA_DIR"

    # Pages deployment test runs after git tests pass
    # This is the only test that uses the actual Pages branch and waits for deployment
    test-pages-lifecycle:
        name: "[Pages] Lifecycle"
        needs:
            [test-git-custom-umbrella, test-git-lifecycle, test-git-concurrent]
        runs-on: ubuntu-latest
        env:
            TEST_ID: test-pages-lifecycle
            TEST_UMBRELLA_DIR: pr-preview-run-${{ github.run_id }}
            TEST_DEPLOY_REPO: rozzjrw/pr-preview-action-testing
            TEST_DEPLOY_REPO_BRANCH: main
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  ref: ${{ inputs.sha }}

            - name: Modify fixture
              env:
                  STEP_TEST_ID: ${{ env.TEST_ID }}
              run: sed -i.bak 's/<p id="testid">.*<\/p>/<p id="testid">'"$STEP_TEST_ID"'<\/p>/' test/fixtures/html/index.html

            - name: Deploy and wait
              uses: ./
              with:
                  pr-number: ${{ env.TEST_ID }}
                  umbrella-dir: ${{ env.TEST_UMBRELLA_DIR }}
                  token: ${{ secrets.test-deploy-token }}
                  deploy-repository: ${{ env.TEST_DEPLOY_REPO }}
                  preview-branch: ${{ env.TEST_DEPLOY_REPO_BRANCH }}
                  source-dir: test/fixtures/html
                  action: deploy
                  comment: false
                  wait-for-pages-deployment: true
                  git-config-name: GitHub Actions
                  git-config-email: actions@github.com
                  deploy-commit-message: deploy ${{ env.TEST_ID }} ${{ github.run_id }}
                  remove-commit-message: remove ${{ env.TEST_ID }} ${{ github.run_id }}

            - name: Verify
              env:
                  GITHUB_TOKEN: ${{ secrets.test-deploy-token }}
                  DEPLOY_REPO: ${{ env.TEST_DEPLOY_REPO }}
                  PREVIEW_BRANCH: ${{ env.TEST_DEPLOY_REPO_BRANCH }}
                  UMBRELLA_DIR: ${{ env.TEST_UMBRELLA_DIR }}
              run: bash test/integration/test-pages-lifecycle.sh "deployed"

            - name: Remove
              uses: ./
              with:
                  pr-number: ${{ env.TEST_ID }}
                  umbrella-dir: ${{ env.TEST_UMBRELLA_DIR }}
                  token: ${{ secrets.test-deploy-token }}
                  deploy-repository: ${{ env.TEST_DEPLOY_REPO }}
                  preview-branch: ${{ env.TEST_DEPLOY_REPO_BRANCH }}
                  action: remove
                  comment: false
                  wait-for-pages-deployment: true
                  git-config-name: GitHub Actions
                  git-config-email: actions@github.com
                  deploy-commit-message: deploy ${{ env.TEST_ID }} ${{ github.run_id }}
                  remove-commit-message: remove ${{ env.TEST_ID }} ${{ github.run_id }}

            - name: Verify removed
              env:
                  GITHUB_TOKEN: ${{ secrets.test-deploy-token }}
                  DEPLOY_REPO: ${{ env.TEST_DEPLOY_REPO }}
                  PREVIEW_BRANCH: ${{ env.TEST_DEPLOY_REPO_BRANCH }}
                  UMBRELLA_DIR: ${{ env.TEST_UMBRELLA_DIR }}
              run: bash test/integration/test-pages-lifecycle.sh "removed"

            - name: Cleanup
              if: failure()
              env:
                  CLEANUP_DEPLOY_REPO: ${{ env.TEST_DEPLOY_REPO }}
                  CLEANUP_TEST_ID: ${{ env.TEST_ID }}
                  CLEANUP_TOKEN: ${{ secrets.test-deploy-token }}
                  CLEANUP_UMBRELLA_DIR: ${{ env.TEST_UMBRELLA_DIR }}
              run: |
                  echo "Action removal failed or was incomplete, performing manual cleanup..."
                  source test/lib/cleanup-test-deployment.sh
                  cleanup_deployment "$CLEANUP_DEPLOY_REPO" "$CLEANUP_TEST_ID" "$CLEANUP_TOKEN" "$CLEANUP_UMBRELLA_DIR"
