name: Test explicit deploy action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTION_REPOSITORY: rossjrw/pr-preview-action
      GITHUB_ACTION_REF: refs/tags/v1.8.1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          action: deploy
          pr-number: "7"
          pages-base-url: "testorg.github.io/testrepo"
          umbrella-dir: pr-preview
          preview-branch: gh-pages
          source-dir: .
          comment: "false"

      - name: Assert deployment-action output is deploy or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DEPLOYMENT_ACTION: ${{ steps.action.outputs.deployment-action }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deployment-action: $DEPLOYMENT_ACTION"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$DEPLOYMENT_ACTION" != "deploy" ]; then
              echo "FAIL: expected deployment-action='deploy' but got '$DEPLOYMENT_ACTION'"
              exit 1
            fi
            echo "PASS: deployment-action is 'deploy'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable for deployment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert preview-url-path is correct when action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PREVIEW_URL_PATH: ${{ steps.action.outputs.preview-url-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "preview-url-path: $PREVIEW_URL_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$PREVIEW_URL_PATH" != "pr-preview/pr-7" ]; then
              echo "FAIL: expected 'pr-preview/pr-7' but got '$PREVIEW_URL_PATH'"
              exit 1
            fi
            echo "PASS: preview-url-path is correct"
          else
            echo "PASS: skipping check (action did not succeed)"
          fi

      - name: Assert preview-url is correct when action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PREVIEW_URL: ${{ steps.action.outputs.preview-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "preview-url: $PREVIEW_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$PREVIEW_URL" != "https://testorg.github.io/testrepo/pr-preview/pr-7/" ]; then
              echo "FAIL: expected 'https://testorg.github.io/testrepo/pr-preview/pr-7/' but got '$PREVIEW_URL'"
              exit 1
            fi
            echo "PASS: preview-url is correct"
          else
            echo "PASS: skipping check (action did not succeed)"
          fi
