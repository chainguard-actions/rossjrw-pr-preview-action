name: Test pages-base-url and preview-url output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: "https://example.github.io/my-repo"
          pages-base-path: ""
          source-dir: .
          pr-number: "7"
          action: auto
          comment: "false"
        continue-on-error: true

      - name: Assert deployment-action is none
        env:
          ACTUAL: ${{ steps.action.outputs.deployment-action }}
        run: |
          echo "actual deployment-action: $ACTUAL"
          if [ "$ACTUAL" != "none" ]; then
            echo "FAIL: expected 'none' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert pages-base-url output matches input
        env:
          ACTUAL: ${{ steps.action.outputs.pages-base-url }}
        run: |
          echo "actual pages-base-url: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected pages-base-url to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert preview-url contains pr-number
        env:
          ACTUAL: ${{ steps.action.outputs.preview-url }}
        run: |
          echo "actual preview-url: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected preview-url to be non-empty"
            exit 1
          fi
          if [[ "$ACTUAL" != *"7"* ]]; then
            echo "FAIL: expected preview-url to contain PR number '7'"
            exit 1
          fi
          echo "PASS"
