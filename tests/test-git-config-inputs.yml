name: Test git-config inputs are accepted (auto resolves to none)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          pr-number: "7"
          pages-base-url: example.github.io/repo
          git-config-name: Preview Bot
          git-config-email: preview-bot@example.com
          preview-branch: gh-pages
          comment: "false"
          qr-code: "false"
          deploy-commit-message: "Deploy preview 7"
          remove-commit-message: "Remove preview 7"
      - name: Assert outputs
        env:
          DEPLOYMENT_ACTION: ${{ steps.action.outputs.deployment-action }}
          URL_PATH: ${{ steps.action.outputs.preview-url-path }}
          URL: ${{ steps.action.outputs.preview-url }}
          SHA: ${{ steps.action.outputs.deployed-commit-sha }}
        run: |
          echo "deployment-action: $DEPLOYMENT_ACTION"
          echo "preview-url-path: $URL_PATH"
          echo "preview-url: $URL"
          echo "deployed-commit-sha: $SHA"
          fail=0
          [ "$DEPLOYMENT_ACTION" = "none" ] || { echo "FAIL: deployment-action"; fail=1; }
          [ "$URL_PATH" = "pr-preview/pr-7" ] || { echo "FAIL: preview-url-path"; fail=1; }
          [ "$URL" = "https://example.github.io/repo/pr-preview/pr-7/" ] || { echo "FAIL: preview-url"; fail=1; }
          [ -z "$SHA" ] || { echo "FAIL: deployed-commit-sha should be empty"; fail=1; }
          [ "$fail" = "0" ] || exit 1
          echo "PASS"
