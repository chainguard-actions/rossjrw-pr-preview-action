name: Test git-config-name and git-config-email inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up local git mirror to satisfy find-current-git-tag.sh
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a tag so git describe works
          git tag v1.0.0-test 2>/dev/null || true
          # Create a bare clone of the current repo
          MIRROR_DIR="$GITHUB_WORKSPACE/.git-mirror"
          rm -rf "$MIRROR_DIR"
          git clone --bare . "$MIRROR_DIR"
          # Redirect the exact sentinel URL to our local mirror.
          # find-current-git-tag.sh clones https://github.com/$github_action_repository
          # Under act with uses: ., github_action_repository = GITHUB_REPOSITORY (sentinel).
          git config --global url."file://$MIRROR_DIR".insteadOf "https://github.com/$GITHUB_REPOSITORY"

      - id: action
        uses: .
        continue-on-error: true
        with:
          action: deploy
          pr-number: "42"
          pages-base-url: "myorg.github.io/myrepo"
          umbrella-dir: pr-preview
          comment: "false"
          git-config-name: "Preview Bot"
          git-config-email: "preview-bot@example.com"
          # The actual deployment to gh-pages will fail against the sentinel repo,
          # but the setup step outputs are set before that.

      - name: Assert deployment-action is deploy
        env:
          ACTUAL: ${{ steps.action.outputs.deployment-action }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deployment-action: $ACTUAL"
          if [ "$ACTUAL" != "deploy" ]; then
            echo "FAIL: expected 'deploy' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert preview-url-path for PR 42
        env:
          ACTUAL: ${{ steps.action.outputs.preview-url-path }}
        run: |
          echo "preview-url-path: $ACTUAL"
          if [ "$ACTUAL" != "pr-preview/pr-42" ]; then
            echo "FAIL: expected 'pr-preview/pr-42' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert preview-url for PR 42
        env:
          ACTUAL: ${{ steps.action.outputs.preview-url }}
        run: |
          echo "preview-url: $ACTUAL"
          if [ "$ACTUAL" != "https://myorg.github.io/myrepo/pr-preview/pr-42/" ]; then
            echo "FAIL: expected 'https://myorg.github.io/myrepo/pr-preview/pr-42/' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
