name: Test git-config-name and git-config-email inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          action: deploy
          pr-number: "1"
          source-dir: .
          umbrella-dir: pr-preview
          preview-branch: gh-pages
          comment: "false"
          git-config-name: "Test Bot"
          git-config-email: "test-bot@example.com"

      - name: Assert setup outputs are present (deployment-action resolved)
        env:
          DEPLOYMENT_ACTION: ${{ steps.action.outputs.deployment-action }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deployment-action: $DEPLOYMENT_ACTION"
          # The setup step should always resolve the deployment action
          # The actual deploy step may fail on the sentinel repo — that is acceptable
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DEPLOYMENT_ACTION" ]; then
              echo "FAIL: action succeeded but deployment-action output is empty"
              exit 1
            fi
            echo "PASS: deployment-action=$DEPLOYMENT_ACTION"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for Pages deployment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
