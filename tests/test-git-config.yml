name: Test git-config-name and git-config-email inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          action: auto
          pr-number: "99"
          umbrella-dir: pr-preview
          pages-base-url: myorg.github.io
          comment: "false"
          git-config-name: "Preview Bot"
          git-config-email: "preview-bot@example.com"

      - name: Assert deployment-action is none (push event)
        env:
          ACTUAL: ${{ steps.action.outputs.deployment-action }}
        run: |
          echo "actual deployment-action: $ACTUAL"
          if [ "$ACTUAL" != "none" ]; then
            echo "FAIL: expected 'none' for push event in auto mode, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert preview-url-path contains pr-99
        env:
          ACTUAL: ${{ steps.action.outputs.preview-url-path }}
        run: |
          echo "actual preview-url-path: $ACTUAL"
          if [[ "$ACTUAL" != *"pr-99"* ]]; then
            echo "FAIL: expected preview-url-path to contain 'pr-99'"
            exit 1
          fi
          echo "PASS"

      - name: Assert preview-url is well-formed
        env:
          ACTUAL: ${{ steps.action.outputs.preview-url }}
        run: |
          echo "actual preview-url: $ACTUAL"
          if [[ "$ACTUAL" != "https://"* ]]; then
            echo "FAIL: expected preview-url to start with 'https://'"
            exit 1
          fi
          echo "PASS"
