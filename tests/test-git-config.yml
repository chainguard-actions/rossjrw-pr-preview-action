name: Test git-config-name and git-config-email inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          action: remove
          pr-number: "42"
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          source-dir: .
          comment: "false"
          git-config-name: "Test Bot"
          git-config-email: "testbot@example.com"

      - name: Assert action ran (setup outputs set, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DEPLOYMENT_ACTION: ${{ steps.action.outputs.deployment-action }}
          ACTION_VERSION: ${{ steps.action.outputs.action-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deployment-action: $DEPLOYMENT_ACTION"
          echo "action-version: $ACTION_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DEPLOYMENT_ACTION" ]; then
              echo "FAIL: action succeeded but deployment-action output is empty"
              exit 1
            fi
            echo "PASS: deployment-action=$DEPLOYMENT_ACTION"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
