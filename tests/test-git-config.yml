name: Test git-config-name and git-config-email inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          action: deploy
          pr-number: "42"
          source-dir: .
          umbrella-dir: pr-preview
          preview-branch: gh-pages
          comment: "false"
          git-config-name: "Test Bot"
          git-config-email: "testbot@example.com"

      - name: Assert setup outputs are present (deployment-action and preview-url-path)
        env:
          DEPLOYMENT_ACTION: ${{ steps.action.outputs.deployment-action }}
          PREVIEW_URL_PATH: ${{ steps.action.outputs.preview-url-path }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deployment-action: $DEPLOYMENT_ACTION"
          echo "preview-url-path: $PREVIEW_URL_PATH"

          # The setup step should always resolve deployment-action to 'deploy'
          # The actual push to gh-pages may fail on the sentinel repo — that is acceptable.
          # What we require is that the setup step ran and produced the deployment-action output.
          if [ "$OUTCOME" = "success" ]; then
            if [ "$DEPLOYMENT_ACTION" != "deploy" ]; then
              echo "FAIL: expected deployment-action=deploy, got '$DEPLOYMENT_ACTION'"
              exit 1
            fi
            if [ -z "$PREVIEW_URL_PATH" ]; then
              echo "FAIL: expected non-empty preview-url-path"
              exit 1
            fi
            echo "PASS: action succeeded with deployment-action=$DEPLOYMENT_ACTION preview-url-path=$PREVIEW_URL_PATH"
          elif [ "$OUTCOME" = "failure" ]; then
            # Deployment to sentinel repo fails — acceptable, setup still ran
            echo "PASS: action failed gracefully (sentinel repo not resolvable for gh-pages push)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
