name: Test setup outputs with pages-base-path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          action: auto
          pr-number: "99"
          preview-branch: gh-pages
          umbrella-dir: previews
          source-dir: .
          pages-base-url: "https://myorg.github.io"
          pages-base-path: "/myrepo"
          comment: "false"
          git-config-name: "Preview Bot"
          git-config-email: "preview@example.com"
          token: ${{ github.token }}

      - name: Assert deployment-action is none
        env:
          ACTUAL: ${{ steps.action.outputs.deployment-action }}
        run: |
          echo "actual deployment-action: $ACTUAL"
          if [ "$ACTUAL" != "none" ]; then
            echo "FAIL: expected 'none' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert action-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.action-version }}
        run: |
          echo "actual action-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected action-version to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert action-start-timestamp output is set
        env:
          ACTUAL: ${{ steps.action.outputs.action-start-timestamp }}
        run: |
          echo "actual action-start-timestamp: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected action-start-timestamp to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert action-start-time output is set
        env:
          ACTUAL: ${{ steps.action.outputs.action-start-time }}
        run: |
          echo "actual action-start-time: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected action-start-time to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert preview-url contains pr-number and umbrella-dir
        env:
          ACTUAL: ${{ steps.action.outputs.preview-url }}
        run: |
          echo "actual preview-url: $ACTUAL"
          if [[ "$ACTUAL" != *"99"* ]]; then
            echo "FAIL: expected preview-url to contain PR number '99', got: $ACTUAL"
            exit 1
          fi
          if [[ "$ACTUAL" != *"previews"* ]]; then
            echo "FAIL: expected preview-url to contain umbrella-dir 'previews', got: $ACTUAL"
            exit 1
          fi
          echo "PASS"
