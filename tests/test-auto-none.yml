name: Test auto action on non-PR event (none)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          action: auto
          pr-number: "42"
          umbrella-dir: pr-preview
          pages-base-url: example.github.io
          comment: "false"

      - name: Assert deployment-action is none
        env:
          ACTUAL: ${{ steps.action.outputs.deployment-action }}
        run: |
          echo "actual deployment-action: $ACTUAL"
          if [ "$ACTUAL" != "none" ]; then
            echo "FAIL: expected 'none', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert pages-base-url is set
        env:
          ACTUAL: ${{ steps.action.outputs.pages-base-url }}
        run: |
          echo "actual pages-base-url: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected pages-base-url to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert preview-url-path is set
        env:
          ACTUAL: ${{ steps.action.outputs.preview-url-path }}
        run: |
          echo "actual preview-url-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected preview-url-path to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert preview-url contains pr-number
        env:
          ACTUAL: ${{ steps.action.outputs.preview-url }}
        run: |
          echo "actual preview-url: $ACTUAL"
          if [[ "$ACTUAL" != *"pr-42"* ]]; then
            echo "FAIL: expected preview-url to contain 'pr-42'"
            exit 1
          fi
          echo "PASS"

      - name: Assert action-start-timestamp is numeric
        env:
          ACTUAL: ${{ steps.action.outputs.action-start-timestamp }}
        run: |
          echo "actual action-start-timestamp: $ACTUAL"
          if ! [[ "$ACTUAL" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected action-start-timestamp to be numeric"
            exit 1
          fi
          echo "PASS"

      - name: Assert action-start-time is set
        env:
          ACTUAL: ${{ steps.action.outputs.action-start-time }}
        run: |
          echo "actual action-start-time: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected action-start-time to be non-empty"
            exit 1
          fi
          echo "PASS"
