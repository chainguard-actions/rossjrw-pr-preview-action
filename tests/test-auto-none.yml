name: Test auto action with non-PR event (none)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          action: auto
          pr-number: "42"
          pages-base-url: "myorg.github.io/myrepo"
          umbrella-dir: pr-preview
          comment: "false"
        env:
          GITHUB_EVENT_NAME: workflow_dispatch

      - name: Assert deployment-action is none or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DEPLOYMENT_ACTION: ${{ steps.action.outputs.deployment-action }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deployment-action: $DEPLOYMENT_ACTION"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$DEPLOYMENT_ACTION" != "none" ]; then
              echo "FAIL: expected deployment-action=none for workflow_dispatch event, got '$DEPLOYMENT_ACTION'"
              exit 1
            fi
            echo "PASS: deployment-action is 'none' as expected for non-PR event"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely due to sentinel repo not being cloneable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
