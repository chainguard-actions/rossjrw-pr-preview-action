name: Test auto action resolves to none for non-PR events
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          action: auto
          pr-number: "42"
          pages-base-url: "example.github.io/myrepo"
          umbrella-dir: pr-preview
          comment: "false"
        continue-on-error: true

      - name: Assert deployment-action is none
        env:
          DEPLOYMENT_ACTION: ${{ steps.action.outputs.deployment-action }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deployment-action: $DEPLOYMENT_ACTION"
          # For workflow_dispatch, auto should resolve to 'none'
          if [ "$DEPLOYMENT_ACTION" = "none" ]; then
            echo "PASS: deployment-action is 'none' as expected for non-PR event"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or other expected failure)"
          else
            echo "FAIL: expected deployment-action='none', got '$DEPLOYMENT_ACTION'"
            exit 1
          fi

      - name: Assert pages-base-url output
        env:
          PAGES_BASE_URL: ${{ steps.action.outputs.pages-base-url }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "pages-base-url: $PAGES_BASE_URL"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully"
            exit 0
          fi
          if [ "$PAGES_BASE_URL" = "example.github.io/myrepo" ]; then
            echo "PASS: pages-base-url matches input"
          else
            echo "FAIL: expected 'example.github.io/myrepo', got '$PAGES_BASE_URL'"
            exit 1
          fi

      - name: Assert preview-url-path output
        env:
          PREVIEW_URL_PATH: ${{ steps.action.outputs.preview-url-path }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "preview-url-path: $PREVIEW_URL_PATH"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully"
            exit 0
          fi
          if [ "$PREVIEW_URL_PATH" = "pr-preview/pr-42" ]; then
            echo "PASS: preview-url-path is correct"
          else
            echo "FAIL: expected 'pr-preview/pr-42', got '$PREVIEW_URL_PATH'"
            exit 1
          fi

      - name: Assert preview-url output
        env:
          PREVIEW_URL: ${{ steps.action.outputs.preview-url }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "preview-url: $PREVIEW_URL"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully"
            exit 0
          fi
          if [ "$PREVIEW_URL" = "https://example.github.io/myrepo/pr-preview/pr-42/" ]; then
            echo "PASS: preview-url is correct"
          else
            echo "FAIL: expected 'https://example.github.io/myrepo/pr-preview/pr-42/', got '$PREVIEW_URL'"
            exit 1
          fi
