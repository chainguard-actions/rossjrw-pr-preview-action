name: Test pages-base-path prefix stripping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test pages-base-path: when umbrella-dir starts with pages-base-path,
      # the prefix should be stripped from preview-url-path
      - id: action-with-base-path
        uses: .
        with:
          action: auto
          pr-number: "10"
          pages-base-url: "myorg.github.io/site"
          pages-base-path: "docs"
          umbrella-dir: "docs/pr-preview"
          comment: "false"
        continue-on-error: true

      - name: Assert preview-url-path strips pages-base-path prefix
        env:
          PREVIEW_URL_PATH: ${{ steps.action-with-base-path.outputs.preview-url-path }}
          OUTCOME: ${{ steps.action-with-base-path.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "preview-url-path: $PREVIEW_URL_PATH"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully"
            exit 0
          fi
          # With pages-base-path=docs and umbrella-dir=docs/pr-preview,
          # the prefix "docs" should be stripped from "docs/pr-preview/pr-10"
          # resulting in "pr-preview/pr-10"
          if [ "$PREVIEW_URL_PATH" = "pr-preview/pr-10" ]; then
            echo "PASS: pages-base-path prefix correctly stripped"
          else
            echo "FAIL: expected 'pr-preview/pr-10', got '$PREVIEW_URL_PATH'"
            exit 1
          fi

      - name: Assert preview-url with base-path stripping
        env:
          PREVIEW_URL: ${{ steps.action-with-base-path.outputs.preview-url }}
          OUTCOME: ${{ steps.action-with-base-path.outcome }}
        run: |
          echo "preview-url: $PREVIEW_URL"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully"
            exit 0
          fi
          if [ "$PREVIEW_URL" = "https://myorg.github.io/site/pr-preview/pr-10/" ]; then
            echo "PASS: preview-url is correct with base-path stripping"
          else
            echo "FAIL: expected 'https://myorg.github.io/site/pr-preview/pr-10/', got '$PREVIEW_URL'"
            exit 1
          fi

      # Test deprecated custom-url input (should behave like pages-base-url)
      - id: action-deprecated-url
        uses: .
        with:
          action: auto
          pr-number: "20"
          custom-url: "legacy.github.io/oldrepo"
          umbrella-dir: pr-preview
          comment: "false"
        continue-on-error: true

      - name: Assert deprecated custom-url is used as pages-base-url
        env:
          PAGES_BASE_URL: ${{ steps.action-deprecated-url.outputs.pages-base-url }}
          PREVIEW_URL: ${{ steps.action-deprecated-url.outputs.preview-url }}
          OUTCOME: ${{ steps.action-deprecated-url.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pages-base-url: $PAGES_BASE_URL"
          echo "preview-url: $PREVIEW_URL"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully"
            exit 0
          fi
          if [ "$PAGES_BASE_URL" = "legacy.github.io/oldrepo" ]; then
            echo "PASS: deprecated custom-url used as pages-base-url"
          else
            echo "FAIL: expected 'legacy.github.io/oldrepo', got '$PAGES_BASE_URL'"
            exit 1
          fi
          if [ "$PREVIEW_URL" = "https://legacy.github.io/oldrepo/pr-preview/pr-20/" ]; then
            echo "PASS: preview-url correct with deprecated custom-url"
          else
            echo "FAIL: expected 'https://legacy.github.io/oldrepo/pr-preview/pr-20/', got '$PREVIEW_URL'"
            exit 1
          fi
