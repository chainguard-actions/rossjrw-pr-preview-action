name: Test pages-base-path with umbrella-dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up local git mirror to satisfy find-current-git-tag.sh
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a tag so git describe works
          git tag v1.0.0-test 2>/dev/null || true
          # Create a bare clone of the current repo
          MIRROR_DIR="$GITHUB_WORKSPACE/.git-mirror"
          rm -rf "$MIRROR_DIR"
          git clone --bare . "$MIRROR_DIR"
          # Redirect the exact sentinel URL to our local mirror.
          # find-current-git-tag.sh clones https://github.com/$github_action_repository
          # Under act with uses: ., github_action_repository = GITHUB_REPOSITORY (sentinel).
          git config --global url."file://$MIRROR_DIR".insteadOf "https://github.com/$GITHUB_REPOSITORY"

      - id: action
        uses: .
        with:
          action: auto
          pr-number: "99"
          pages-base-url: "myorg.github.io/docs"
          pages-base-path: "docs"
          umbrella-dir: docs/pr-preview
          comment: "false"
        # auto with workflow_dispatch => deployment-action=none, no deployment steps run

      - name: Assert deployment-action is none
        env:
          ACTUAL: ${{ steps.action.outputs.deployment-action }}
        run: |
          echo "deployment-action: $ACTUAL"
          if [ "$ACTUAL" != "none" ]; then
            echo "FAIL: expected 'none' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert pages-base-url
        env:
          ACTUAL: ${{ steps.action.outputs.pages-base-url }}
        run: |
          echo "pages-base-url: $ACTUAL"
          if [ "$ACTUAL" != "myorg.github.io/docs" ]; then
            echo "FAIL: expected 'myorg.github.io/docs' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert preview-url-path strips pages-base-path prefix
        env:
          ACTUAL: ${{ steps.action.outputs.preview-url-path }}
        run: |
          echo "preview-url-path: $ACTUAL"
          # umbrella-dir=docs/pr-preview, pages-base-path=docs
          # preview_file_path = docs/pr-preview/pr-99
          # remove_prefix_path("docs", "docs/pr-preview/pr-99") = "pr-preview/pr-99"
          if [ "$ACTUAL" != "pr-preview/pr-99" ]; then
            echo "FAIL: expected 'pr-preview/pr-99' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert preview-url is correct
        env:
          ACTUAL: ${{ steps.action.outputs.preview-url }}
        run: |
          echo "preview-url: $ACTUAL"
          if [ "$ACTUAL" != "https://myorg.github.io/docs/pr-preview/pr-99/" ]; then
            echo "FAIL: expected 'https://myorg.github.io/docs/pr-preview/pr-99/' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
