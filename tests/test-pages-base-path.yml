name: Test pages-base-path stripping from preview URL path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that pages-base-path is stripped from the preview-url-path
      # umbrella-dir=docs/pr-preview, pages-base-path=docs
      # => preview_file_path = docs/pr-preview/pr-3
      # => preview_url_path = pr-preview/pr-3 (docs/ stripped)
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: auto
          pr-number: "3"
          pages-base-url: "example.github.io/my-site"
          pages-base-path: "docs"
          umbrella-dir: docs/pr-preview
          comment: "false"
        env:
          GITHUB_EVENT_NAME: workflow_dispatch

      - name: Assert pages-base-path is stripped from preview-url-path
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DEPLOYMENT_ACTION: ${{ steps.action.outputs.deployment-action }}
          PREVIEW_URL_PATH: ${{ steps.action.outputs.preview-url-path }}
          PREVIEW_URL: ${{ steps.action.outputs.preview-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deployment-action: $DEPLOYMENT_ACTION"
          echo "preview-url-path: $PREVIEW_URL_PATH"
          echo "preview-url: $PREVIEW_URL"
          if [ "$OUTCOME" = "success" ]; then
            # For workflow_dispatch event, auto action should be 'none'
            if [ "$DEPLOYMENT_ACTION" != "none" ]; then
              echo "FAIL: expected deployment-action=none for workflow_dispatch, got '$DEPLOYMENT_ACTION'"
              exit 1
            fi
            # pages-base-path=docs should be stripped from umbrella-dir=docs/pr-preview
            # so preview_url_path should be pr-preview/pr-3
            if [ "$PREVIEW_URL_PATH" != "pr-preview/pr-3" ]; then
              echo "FAIL: expected preview-url-path=pr-preview/pr-3 (docs/ stripped), got '$PREVIEW_URL_PATH'"
              exit 1
            fi
            if [ "$PREVIEW_URL" != "https://example.github.io/my-site/pr-preview/pr-3/" ]; then
              echo "FAIL: expected preview-url=https://example.github.io/my-site/pr-preview/pr-3/, got '$PREVIEW_URL'"
              exit 1
            fi
            echo "PASS: pages-base-path correctly stripped from preview-url-path"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not cloneable for version detection)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
