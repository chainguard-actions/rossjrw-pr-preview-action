name: Test umbrella-dir path normalisation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          action: none
          pr-number: "3"
          umbrella-dir: ./previews/
          pages-base-url: example.com
      - name: Assert outputs
        env:
          URL_PATH: ${{ steps.action.outputs.preview-url-path }}
          URL: ${{ steps.action.outputs.preview-url }}
        run: |
          echo "preview-url-path: $URL_PATH"
          echo "preview-url: $URL"
          if [ "$URL_PATH" != "previews/pr-3" ]; then
            echo "FAIL: expected 'previews/pr-3'"
            exit 1
          fi
          if [ "$URL" != "https://example.com/previews/pr-3/" ]; then
            echo "FAIL: unexpected preview-url"
            exit 1
          fi
          echo "PASS"
