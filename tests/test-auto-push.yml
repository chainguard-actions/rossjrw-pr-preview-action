name: Test auto action on push event (no-op)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          action: auto
          pr-number: "42"
          pages-base-url: "example.github.io"
          umbrella-dir: pr-preview
          preview-branch: gh-pages
          source-dir: .
          comment: "false"
          wait-for-pages-deployment: "false"
        env:
          GITHUB_EVENT_NAME: push

      - name: Assert deployment-action is none
        env:
          ACTUAL: ${{ steps.action.outputs.deployment-action }}
        run: |
          echo "actual deployment-action: $ACTUAL"
          if [ "$ACTUAL" != "none" ]; then
            echo "FAIL: expected 'none' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert preview-url-path is set
        env:
          ACTUAL: ${{ steps.action.outputs.preview-url-path }}
        run: |
          echo "actual preview-url-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected preview-url-path to be non-empty"
            exit 1
          fi
          echo "PASS: preview-url-path=$ACTUAL"

      - name: Assert preview-url contains pr-number
        env:
          ACTUAL: ${{ steps.action.outputs.preview-url }}
        run: |
          echo "actual preview-url: $ACTUAL"
          if [[ "$ACTUAL" != *"pr-42"* ]]; then
            echo "FAIL: expected preview-url to contain 'pr-42'"
            exit 1
          fi
          echo "PASS"

      - name: Assert pages-base-url output
        env:
          ACTUAL: ${{ steps.action.outputs.pages-base-url }}
        run: |
          echo "actual pages-base-url: $ACTUAL"
          if [ "$ACTUAL" != "example.github.io" ]; then
            echo "FAIL: expected 'example.github.io' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert action-start-timestamp is set
        env:
          ACTUAL: ${{ steps.action.outputs.action-start-timestamp }}
        run: |
          echo "actual action-start-timestamp: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected action-start-timestamp to be non-empty"
            exit 1
          fi
          echo "PASS"
